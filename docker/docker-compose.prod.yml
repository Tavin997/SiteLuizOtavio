version: '3.8'

services:
  # Backend (NestJS + Prisma) - Produção
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: game-backend-prod
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - game-network
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (React + Vite) - Produção
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend.prod
    container_name: game-frontend-prod
    environment:
      - VITE_API_URL=/api
    ports:
      - "80:3000"
      - "443:443"
    restart: unless-stopped
    networks:
      - game-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL - Apenas se não usar Aiven
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: game-db-prod
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: ${POSTGRES_DB}
  #   volumes:
  #     - postgres-data-prod:/var/lib/postgresql/data
  #   networks:
  #     - game-network
  #   restart: unless-stopped

# volumes:
#   postgres-data-prod:

networks:
  game-network:
    driver: bridge
